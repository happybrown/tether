name: CI

# PR 과 main 직접 푸시에서 빌드·테스트를 검증한다.
# 이 워크플로의 job 이름(build)을 브랜치 보호의 required status check 로 지정하면
# 빌드가 성공한 PR 만 main 에 머지할 수 있다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 PR 에 새 커밋이 올라오면 이전 실행은 취소해 러너 시간을 아낀다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # xcodegen 이 생성하는 프로젝트 포맷은 설치된 Xcode 버전을 따른다.
      # 러너 기본값에 맡기면 생성 포맷이 빌드용 Xcode 보다 최신이라 열지 못하는
      # 경우가 있어(objectVersion 불일치), 사용할 Xcode 를 명시적으로 고정한다.
      - name: Select Xcode
        run: |
          # 설치된 Xcode 중 가장 최신을 고른다. 경로를 고정하면 러너 이미지가
          # 바뀔 때 깨지므로, 실제 존재하는 것 중에서 선택한다.
          APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "선택: $APP"
          sudo xcode-select -s "$APP"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      # build.sh 가 xcodegen generate 를 포함한다. 이어지는 테스트 스텝도
      # 여기서 생성된 프로젝트를 쓴다.
      # 서명은 tether-dev 인증서가 없는 러너에서 adhoc 으로 폴백된다(빌드 검증에는 충분).
      - name: Build (Release)
        run: bash build.sh

      # test.sh 는 grep 파이프와 `|| true` 로 실패를 삼켜 게이트로 쓸 수 없다.
      # 종료 코드가 그대로 전달되도록 xcodebuild 를 직접 호출한다.
      - name: Test TetherCoreTests
        run: |
          xcodebuild test \
            -project TetherApp.xcodeproj \
            -scheme TetherCoreTests \
            -configuration Debug \
            -derivedDataPath build \
            -destination "platform=macOS" \
            -quiet

      - name: Test TetherAppTests
        run: |
          xcodebuild test \
            -project TetherApp.xcodeproj \
            -scheme TetherAppTests \
            -configuration Debug \
            -derivedDataPath build \
            -destination "platform=macOS" \
            -quiet
