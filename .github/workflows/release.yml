name: Release

# v* 태그를 푸시하면 해당 버전으로 dmg 를 만들어 릴리스에 첨부한다.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 릴리스 생성 및 자산 업로드에 필요

jobs:
  release:
    name: Build and publish dmg
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      # CI 와 동일한 Xcode 를 쓴다 (프로젝트 생성 포맷 불일치 방지).
      - name: Select Xcode
        run: |
          # 설치된 Xcode 중 가장 최신을 고른다. 경로를 고정하면 러너 이미지가
          # 바뀔 때 깨지므로, 실제 존재하는 것 중에서 선택한다.
          APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "선택: $APP"
          sudo xcode-select -s "$APP"
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      # 태그(v1.2.3)에서 버전을 뽑아 project.yml 에 반영한다.
      # project.yml 이 버전 단일 소스이므로, 이렇게 해야 앱 번들과 dmg 파일명이
      # 태그와 정확히 일치한다.
      - name: Set version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "태그가 vX.Y.Z 형식이 아닙니다: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          sed -i '' -E "s/(MARKETING_VERSION: )\"[0-9.]+\"/\1\"$VERSION\"/" project.yml
          # 빌드 번호는 릴리스마다 단조 증가해야 한다 (동일 버전 재릴리스 구분용).
          sed -i '' -E "s/(CURRENT_PROJECT_VERSION: )\"[0-9]+\"/\1\"${GITHUB_RUN_NUMBER}\"/" project.yml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "릴리스 버전: $VERSION (빌드 ${GITHUB_RUN_NUMBER})"

      # 아키텍처별 자산 3종을 순서대로 빌드/패키징한다.
      # make_dmg.sh 가 바이너리 아키텍처를 읽어 접미사를 붙이므로 이름이 겹치지 않는다.
      - name: Build and package (universal, arm64, x86_64)
        run: |
          for ARCH in universal arm64 x86_64; do
            bash build.sh "$ARCH"
            bash make_dmg.sh
          done
          ls -lh bin/*.dmg

      - name: Verify built version matches tag
        run: |
          BUILT=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' \
                  bin/Tether.app/Contents/Info.plist)
          if [ "$BUILT" != "${{ steps.version.outputs.version }}" ]; then
            echo "버전 불일치: 앱=$BUILT, 태그=${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
          echo "버전 일치 확인: $BUILT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Tether-*.dmg
          generate_release_notes: true
          body: |
            ## 설치

            1. `Tether-${{ steps.version.outputs.version }}-universal.dmg` 를 내려받아 연다
               (Apple Silicon/Intel 공용. 용량을 아끼려면 기기에 맞는 `-arm64`/`-x86_64` dmg 를 받아도 된다)
            2. Tether.app 을 Applications 로 끌어다 놓는다
            3. 시스템 설정 → 개인 정보 보호 및 보안 → 손쉬운 사용에서 Tether 를 허용한다

            > 이 빌드는 Apple Developer 인증서로 공증(notarize)되지 않았다.
            > 처음 실행할 때 Gatekeeper 경고가 나오면 앱을 오른쪽 클릭 → 열기를 선택한다.
